  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

: 0 auto; padding: clamp(70px,10vw,140px) clamp(20px,6vw,72px) clamp(50px,6vw,80px); text-align: center;\">\n    <div style=\"display: inline-flex; align-items: center; gap: 9px; padding: 7px 15px; border-radius: 999px; border: 1px solid var(--line,rgba(17,24,39,.12)); font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--sub,#6b7280); margin-bottom: 32px;\">\n      <span style=\"width: 7px; height: 7px; border-radius: 50%; background: var(--accent,#2563eb);\"><\u002Fspan>AI Leader and Architect \n    <\u002Fdiv>\n    <h1 style=\"font-family: 'Space Grotesk'; font-weight: 700; font-size: clamp(42px,6.5vw,80px); line-height: 1.02; letter-spacing: -0.035em; margin: 0 auto 26px; max-width: 15ch; color: var(--ink,#111827);\">I architect agentic AI that ships to production.<\u002Fh1>\n    <p style=\"font-size: clamp(16px,1.5vw,20px); line-height: 1.65; color: var(--sub,#6b7280); max-width: 660px; margin: 0 auto 38px; text-wrap: pretty;\">I design multi-agent orchestration, Graph RAG systems, and production-scale LLM platforms. Over <strong style=\"color: var(--ink,#111827); font-weight: 600;\">7+ years in ML/AI<\u002Fstrong> and <strong style=\"color: var(--ink,#111827); font-weight: 600;\">15+ in software<\u002Fstrong> — bridging deep systems engineering with applied AI design across AWS &amp; GCP.<\u002Fp>\n    <div style=\"display: flex; flex-wrap: wrap; gap: 13px; justify-content: center; margin-bottom: 56px;\">\n      <a href=\"#work\" style=\"display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px; border-radius: 11px; font-weight: 600; font-size: 15px; color: var(--onAccent,#fff); background: var(--accent,#2563eb); box-shadow: 0 8px 24px color-mix(in srgb, var(--accent,#2563eb) 26%, transparent);\" style-hover=\"{{ ctaHover }}\">View projects →<\u002Fa>\n      <a href=\"#contact\" style=\"display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px; border-radius: 11px; font-weight: 500; font-size: 15px; color: var(--ink,#111827); border: 1px solid var(--line,rgba(17,24,39,.14)); background: var(--bg2,#f8fafc);\" style-hover=\"{{ ghostHover }}\">Get in touch<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; border: 1px solid var(--line,rgba(17,24,39,.1)); border-radius: 16px; overflow: hidden; background: var(--line,rgba(17,24,39,.1));\">\n      <sc-for list=\"{{ stats }}\" as=\"s\" hint-placeholder-count=\"4\">\n        <div style=\"background: var(--bg,#fff); padding: 22px 14px;\">\n          <div style=\"font-family: 'Space Grotesk'; font-weight: 700; font-size: clamp(22px,2.6vw,30px); color: var(--ink,#111827); letter-spacing: -0.02em;\">{{ s.big }}<\u002Fdiv>\n          <div style=\"font-size: 12.5px; color: var(--sub,#6b7280); margin-top: 4px;\">{{ s.label }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- WORK -->\n  <section id=\"work\" style=\"max-width: 1080px; margin: 0 auto; padding: clamp(48px,6vw,90px) clamp(20px,6vw,72px);\">\n    <div style=\"display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 8px;\">\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--accent,#2563eb);\">Selected work<\u002Fspan>\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--sub,#6b7280);\">architecture-first<\u002Fspan>\n    <\u002Fdiv>\n    <h2 style=\"font-family: 'Space Grotesk'; font-weight: 700; font-size: clamp(28px,3.6vw,42px); letter-spacing: -0.02em; margin: 0 0 12px; color: var(--ink,#111827);\">Systems I've designed &amp; built<\u002Fh2>\n    <p style=\"font-size: 15px; color: var(--sub,#6b7280); max-width: 640px; margin: 0 0 40px;\">Each project leads with its system architecture — the pipeline, the reasoning layer, and how it stays reliable in production.<\u002Fp>\n\n    <div style=\"display: flex; flex-direction: column; gap: 24px;\">\n      <sc-for list=\"{{ projects }}\" as=\"p\" hint-placeholder-count=\"5\">\n        <article style=\"border-radius: 20px; border: 1px solid var(--line,rgba(17,24,39,.1)); background: var(--bg,#fff); overflow: hidden; box-shadow: 0 1px 3px var(--shadow,rgba(17,24,39,.05));\" style-hover=\"{{ cardHover }}\">\n          <!-- architecture band -->\n          <div style=\"background: var(--bg2,#f8fafc); border-bottom: 1px solid var(--line,rgba(17,24,39,.09)); padding: 26px clamp(20px,3vw,34px);\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 18px;\">\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--sub,#6b7280);\">System architecture<\u002Fspan>\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 4px 10px; border-radius: 6px; background: var(--accentSoft,rgba(37,99,235,.08)); color: var(--accent,#2563eb);\">{{ p.tag }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: flex; align-items: stretch; flex-wrap: wrap; gap: 8px;\">\n              <sc-for list=\"{{ p.flow }}\" as=\"node\" hint-placeholder-count=\"4\">\n                <div style=\"display: flex; align-items: center; gap: 8px;\">\n                  <div style=\"display: flex; align-items: center; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line,rgba(17,24,39,.12)); background: var(--bg,#fff); font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink,#111827); white-space: nowrap;\">{{ node.label }}<\u002Fdiv>\n                  <sc-if value=\"{{ node.sep }}\" hint-placeholder-val=\"{{ true }}\">\n                    <span style=\"color: var(--accent,#2563eb); font-size: 15px;\">→<\u002Fspan>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <!-- body -->\n          <div style=\"padding: clamp(24px,3vw,36px); display: grid; grid-template-columns: 1.5fr 1fr; gap: clamp(24px,3vw,44px);\">\n            <div>\n              <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 12px;\">\n                <h3 style=\"font-family: 'Space Grotesk'; font-weight: 700; font-size: 24px; margin: 0; color: var(--ink,#111827);\">{{ p.name }}<\u002Fh3>\n                <div style=\"display: flex; gap: 8px;\">\n                  <sc-for list=\"{{ p.links }}\" as=\"lnk\" hint-placeholder-count=\"1\">\n                    <a href=\"{{ lnk.href }}\" target=\"_blank\" style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 5px 11px; border-radius: 8px; border: 1px solid var(--line,rgba(17,24,39,.14)); color: var(--sub,#6b7280);\" style-hover=\"{{ ghostHover }}\">↗ {{ lnk.label }}<\u002Fa>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <p style=\"font-size: 15px; line-height: 1.65; color: var(--sub,#6b7280); margin: 0 0 20px; text-wrap: pretty;\">{{ p.desc }}<\u002Fp>\n              <div style=\"display: flex; flex-wrap: wrap; gap: 7px;\">\n                <sc-for list=\"{{ p.tech }}\" as=\"tech\" hint-placeholder-count=\"5\">\n                  <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11.5px; padding: 5px 11px; border-radius: 7px; background: var(--bg2,#f8fafc); border: 1px solid var(--line,rgba(17,24,39,.1)); color: var(--sub,#6b7280);\">{{ tech }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--sub,#6b7280); margin-bottom: 12px;\">Key decisions<\u002Fdiv>\n              <ul style=\"list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px;\">\n                <sc-for list=\"{{ p.bullets }}\" as=\"b\" hint-placeholder-count=\"3\">\n                  <li style=\"display: flex; gap: 10px; font-size: 13.5px; line-height: 1.5; color: var(--ink,#111827);\"><span style=\"color: var(--accent,#2563eb); flex-shrink: 0; font-weight: 700;\">·<\u002Fspan><span>{{ b }}<\u002Fspan><\u002Fli>\n                <\u002Fsc-for>\n              <\u002Ful>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Farticle>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- IMPACT DASHBOARD -->\n  <section id=\"impact\" style=\"background: var(--bg2,#f8fafc); border-top: 1px solid var(--line,rgba(17,24,39,.09)); border-bottom: 1px solid var(--line,rgba(17,24,39,.09));\">\n    <div style=\"max-width: 1080px; margin: 0 auto; padding: clamp(48px,6vw,90px) clamp(20px,6vw,72px);\">\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--accent,#2563eb);\">Measured impact<\u002Fspan>\n      <h2 style=\"font-family: 'Space Grotesk'; font-weight: 700; font-size: clamp(28px,3.6vw,42px); letter-spacing: -0.02em; margin: 10px 0 40px; color: var(--ink,#111827);\">Outcomes in production<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px;\">\n        <sc-for list=\"{{ impact }}\" as=\"m\" hint-placeholder-count=\"6\">\n          <div style=\"border-radius: 16px; border: 1px solid var(--line,rgba(17,24,39,.1)); background: var(--bg,#fff); padding: 26px; box-shadow: 0 1px 3px var(--shadow,rgba(17,24,39,.04));\" style-hover=\"{{ cardHover }}\">\n            <div style=\"display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px;\">\n              <span style=\"font-family: 'Space Grotesk'; font-weight: 700; font-size: 34px; letter-spacing: -0.02em; color: var(--accent,#2563eb);\">{{ m.big }}<\u002Fspan>\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--sub,#6b7280);\">{{ m.unit }}<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"font-size: 14px; line-height: 1.55; color: var(--ink,#111827); margin: 0;\">{{ m.label }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- WRITING -->\n  <section id=\"writing\" style=\"max-width: 1080px; margin: 0 auto; padding: clamp(48px,6vw,90px) clamp(20px,6vw,72px);\">\n    <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--accent,#2563eb);\">Writing<\u002Fspan>\n    <h2 style=\"font-family: 'Space Grotesk'; font-weight: 700; font-size: clamp(28px,3.6vw,42px); letter-spacing: -0.02em; margin: 10px 0 40px; color: var(--ink,#111827);\">Notes on building AI systems<\u002Fh2>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px;\">\n      <sc-for list=\"{{ articles }}\" as=\"a\" hint-placeholder-count=\"6\">\n        <a href=\"{{ a.href }}\" target=\"_blank\" style=\"display: flex; flex-direction: column; gap: 12px; padding: 26px; border-radius: 16px; border: 1px solid var(--line,rgba(17,24,39,.1)); background: var(--bg,#fff); box-shadow: 0 1px 3px var(--shadow,rgba(17,24,39,.04));\" style-hover=\"{{ cardHover }}\">\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--sub,#6b7280);\">{{ a.meta }}<\u002Fspan>\n          <h3 style=\"font-family: 'Space Grotesk'; font-weight: 600; font-size: 18px; line-height: 1.3; margin: 0; color: var(--ink,#111827);\">{{ a.title }}<\u002Fh3>\n          <p style=\"font-size: 13.5px; line-height: 1.6; color: var(--sub,#6b7280); margin: 0; flex: 1; text-wrap: pretty;\">{{ a.desc }}<\u002Fp>\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--accent,#2563eb); margin-top: 4px;\">Read on Medium ↗<\u002Fspan>\n        <\u002Fa>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SKILLS -->\n  <section id=\"skills\" style=\"background: var(--bg2,#f8fafc); border-top: 1px solid var(--line,rgba(17,24,39,.09)); border-bottom: 1px solid var(--line,rgba(17,24,39,.09));\">\n    <div style=\"max-width: 1080px; margin: 0 auto; padding: clamp(48px,6vw,90px) clamp(20px,6vw,72px);\">\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--accent,#2563eb);\">Stack<\u002Fspan>\n      <h2 style=\"font-family: 'Space Grotesk'; font-weight: 700; font-size: clamp(28px,3.6vw,42px); letter-spacing: -0.02em; margin: 10px 0 40px; color: var(--ink,#111827);\">Technical toolkit<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px;\">\n        <sc-for list=\"{{ skills }}\" as=\"g\" hint-placeholder-count=\"3\">\n          <div style=\"padding: 26px; border-radius: 16px; border: 1px solid var(--line,rgba(17,24,39,.1)); background: var(--bg,#fff);\">\n            <h3 style=\"font-family: 'Space Grotesk'; font-weight: 600; font-size: 16px; margin: 0 0 16px; color: var(--ink,#111827);\">{{ g.name }}<\u002Fh3>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\n              <sc-for list=\"{{ g.items }}\" as=\"it\" hint-placeholder-count=\"8\">\n                <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 6px 11px; border-radius: 7px; border: 1px solid var(--line,rgba(17,24,39,.1)); background: var(--bg2,#f8fafc); color: var(--sub,#6b7280);\">{{ it }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- RESEARCH -->\n  <section id=\"research\" style=\"max-width: 1080px; margin: 0 auto; padding: clamp(48px,6vw,90px) clamp(20px,6vw,72px);\">\n    <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--accent,#2563eb);\">Research<\u002Fspan>\n    <h2 style=\"font-family: 'Space Grotesk'; font-weight: 700; font-size: clamp(28px,3.6vw,42px); letter-spacing: -0.02em; margin: 10px 0 32px; color: var(--ink,#111827);\">Academic work<\u002Fh2>\n    <div style=\"border-radius: 20px; border: 1px solid var(--line,rgba(17,24,39,.1)); background: var(--bg,#fff); padding: clamp(28px,3.5vw,48px); box-shadow: 0 1px 3px var(--shadow,rgba(17,24,39,.05));\">\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--accent,#2563eb);\">UC Berkeley MIDS · Whitepaper<\u002Fspan>\n      <h3 style=\"font-family: 'Space Grotesk'; font-weight: 700; font-size: clamp(20px,2.4vw,30px); line-height: 1.25; letter-spacing: -0.01em; margin: 14px 0 20px; color: var(--ink,#111827); max-width: 900px;\">Zero-Shot vs. Fine-Tuned: A Systematic Evaluation of Encoder, Decoder, and LLM Architectures for Clinical Text Classification<\u002Fh3>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 26px;\">\n        <sc-for list=\"{{ researchTags }}\" as=\"t\" hint-placeholder-count=\"6\">\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 5px 10px; border-radius: 6px; background: var(--bg2,#f8fafc); border: 1px solid var(--line,rgba(17,24,39,.1)); color: var(--sub,#6b7280);\">{{ t }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"font-size: 15px; line-height: 1.75; color: var(--sub,#6b7280); margin: 0 0 16px; max-width: 860px; text-wrap: pretty;\">A systematic comparison of zero-shot LLMs versus fine-tuned transformer architectures for single-label clinical text classification across three real-world, imbalanced healthcare datasets — evaluating encoder-based (PubMedBERT), encoder-decoder (T5-base), and decoder-only LLM (Mistral-7B + LoRA) paradigms against a zero-shot GPT-4 baseline.<\u002Fp>\n      <p style=\"font-size: 15px; line-height: 1.75; color: var(--sub,#6b7280); margin: 0 0 30px; max-width: 860px; text-wrap: pretty;\">Results show domain-specific fine-tuned encoders achieve superior efficiency-performance trade-offs (F1 0.63–0.97), while zero-shot LLMs enable rapid deployment without labeled data (F1 0.48–0.71). Introduces a reproducible zero-shot evaluation framework with optimized system prompts, constraint-based output formatting, and statistical significance testing.<\u002Fp>\n      <a href=\"https://github.com/kirthistaank/MIDS/blob/main/technicalpapers/Zero-Shot%20vs.%20Fine-Tuned.pdf\" target=\"_blank\" style=\"display: inline-flex; align-items: center; gap: 9px; padding: 13px 24px; border-radius: 11px; font-weight: 600; font-size: 14px; color: var(--onAccent,#fff); background: var(--accent,#2563eb);\" style-hover=\"{{ ctaHover }}\">Read the whitepaper ↗<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CONTACT -->\n  <section id=\"contact\" style=\"max-width: 1080px; margin: 0 auto; padding: clamp(48px,6vw,90px) clamp(20px,6vw,72px);\">\n    <div style=\"border-radius: 24px; border: 1px solid var(--line,rgba(17,24,39,.1)); background: var(--bg2,#f8fafc); padding: clamp(40px,5vw,80px); text-align: center;\">\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--accent,#2563eb);\">Let's talk<\u002Fspan>\n      <h2 style=\"font-family: 'Space Grotesk'; font-weight: 700; font-size: clamp(30px,4.5vw,54px); letter-spacing: -0.025em; margin: 14px 0 18px; color: var(--ink,#111827);\">Let's build something intelligent.<\u002Fh2>\n      <p style=\"font-size: 16px; line-height: 1.7; color: var(--sub,#6b7280); max-width: 560px; margin: 0 auto 20px; text-wrap: pretty;\">Open to AI engineering &amp; architecture roles, collaborations, or a quick chat about agentic AI, RAG systems, and production ML.<\u002Fp>\n      <div style=\"display: inline-flex; align-items: center; gap: 18px; flex-wrap: wrap; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--sub,#6b7280); margin-bottom: 32px;\">\n        <span>30 min<\u002Fspan><span style
